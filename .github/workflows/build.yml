name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32" -DLSFGVK_BUILD_CLI=OFF
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json

          # Copy LSFG engine binaries
          find build64 -name "liblsfg-vk-layer.so" -exec cp {} decky-plugin/bin/liblsfg-vk-layer.so \;
          find build32 -name "liblsfg-vk-layer.so" -exec cp {} decky-plugin/bin/liblsfg-vk-layer_32.so \;
          find build64 -name "VkLayer_LSFGVK_frame_generation.json" -exec cp {} decky-plugin/bin/VkLayer_LSFGVK_frame_generation.json \;
          find build64 -name "lsfg-vk-cli" -type f -exec cp {} decky-plugin/bin/lsfg-vk-cli \;
          chmod +x decky-plugin/bin/lsfg-vk-cli || true

          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.9.0
          name: "SkyFrame v1.9.0 — LSFG Neural Engine (Lossless Scaling) & Dual-Engine Architecture"
          body: |
            ## 🚀 SkyFrame v1.9.0 — Интеграция нейросетевого движка LSFG (Lossless Scaling) и двухдвижковая архитектура

            В этом крупном релизе SkyFrame получил возможность запускать полноценный нейросетевой конвейер **Lossless Scaling (LSFG)** прямо на Steam Deck и Linux, используя вашу купленную лицензионную копию из Steam!

            ---

            ### 🌟 1. Интеграция нейросети LSFG (Lossless Scaling)
            - **Прямое выполнение SPIR-V нейросети**: Движок извлекает 24 скомпилированных шейдерных прохода нейросети из вашего лицензионного файла `Lossless.dll` и исполняет их нативно через Vulkan Compute.
            - **FP16 Rapid Packed Math**: Аппаратное ускорение половинной точности на архитектуре AMD RDNA2 (Steam Deck) сокращает время инференса до ~4–6 мс на кадр при разрешении 720p/800p без потери визуального качества.
            - **Множители 2x, 3x, 4x**: Поддержка удвоения, утроения и учетверения кадровой частоты (например, 30 → 60 FPS, 30 → 90 FPS на OLED, 45 → 90 FPS).
            - **Автоопределение Lossless.dll**: Плагин автоматически находит установленный Lossless Scaling во всех библиотеках Steam и на microSD-картах.
            - **Совместимость с веткой `lsfg-vk`**: Для гарантированной стабильности и FP16 используется проверенная официальная бета-ветка Lossless Scaling в Steam (`Свойства -> Бета-версии -> lsfg-vk`).

            ### ⚡ 2. Двухдвижковая архитектура (Dual-Engine)
            В меню плагина Decky теперь доступен селектор движка генерации:
            1. **⭐ LSFG Нейросеть (Lossless Scaling)**: максимальное нейросетевое качество интерполяции с поддержкой FP16 и 2x/3x/4x.
            2. **SkyFrame DIS (Нативный оптический поток)**: полностью автономный встроенный алгоритм DIS-Flow + TV-L1 с 3x3 векторной медианной очисткой (работает без сторонних файлов).

            ### 🎮 3. Полная поддержка 64-bit и 32-bit (Multilib)
            - Скомпилированы и упакованы 64-битные и 32-битные версии обоих Vulkan-слоев (`libVkLayer_skyframe.so`, `liblsfg-vk-layer.so`).
            - Поддержка классических 32-битных игр и современных 64-битных блокбастеров.

            ### 🛠️ 4. Встроенная диагностика (lsfg-vk-cli)
            - В плагин интегрирована утилита `lsfg-vk-cli healthcheck` для мгновенной проверки корректности установки и валидации файлов.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
