name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.7
          name: "SkyFrame v1.0.7 for Steam Deck"
          body: |
            ## 🚀 SkyFrame v1.0.7 — Асинхронный Frame Pacer и устранение пилы фреймтайма

            ### Что нового и исправлено в v1.0.7:
            - **Асинхронный Frame Pacer (Presentation Worker Thread):** полностью устранено слипание вызовов презентации (когда промежуточный и игровой кадры выстреливали за 0.05 мс). Внедрен независимый высокоточный поток вывода кадров (`std::thread`).
            - **Устранение «пилы» фреймтайма в MangoHud:** теперь кадр игры отдается мгновенно с нулевой задержкой ввода, а промежуточный кадр планируется ровно на середину временного окна кадра ($\Delta T / 2$, т.е. 16.67 мс при 30 FPS). График фреймтайма в MangoHud превращается в ровную прямую линию на 16.6 мс.
            - **Устранение Micro-stuttering и Judder в Gamescope:** каждый такт развертки экрана 60 Гц на Steam Deck теперь получает ровно по одному новому кадру без пропусков и дублирования, восстанавливая физическую плавность 60 FPS.
            - **Потокобезопасная синхронизация `VkQueue`:** все вызовы `vkQueuePresentKHR` и `vkQueueSubmit` защищены мьютексом очереди в соответствии со спецификацией Vulkan.
            - **Адаптивный EMA-фильтр фреймтайма:** умное отсечение пауз загрузки (>250 мс) и микро-всплесков (<2 мс) для предотвращения рассинхронизации таймингов.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
