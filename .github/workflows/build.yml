name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8.1
          name: "SkyFrame v1.8.1 — Hardware Presentation Sequencer (Guaranteed VBlank Delivery)"
          body: |
            ## 🚀 SkyFrame v1.8.1 — Аппаратный секвенсор доставки кадров (Hardware Presentation Sequencer)

            В этом обновлении решена проблема с перезаписью буферов в Gamescope DRM Direct Scanout (`flip: true`):

            ### 1. Архитектурный Секвенсор Презентаций (Presentation Sequencer)
            - **Устранение перезаписи коммитов в Gamescope**: В Gamescope WSI с Direct Scanout отправка двух кадров в течение одного миллисекунды приводила к тому, что композитор Wayland заменял первый буфер вторым ещё до наступления VBlank. В результате сгенерированный кадр ($F_{N-0.5}$) никогда не выводился на экран.
            - **Выделенный секвенсор в изолированном потоке**: Основной поток игры теперь мгновенно возвращает управление сразу после отправки compute-шейдеров, обеспечивая минимальный input lag.
            - **Строгое межфазное разделение VBlank (~16.67 мс)**: Секвенсор выводит сгенерированный кадр, выжидает ровно один такт вертикальной развёртки дисплея через высокоточный `SleepUntil`, и затем выводит настоящий кадр игры. Оба кадра физически сменяют друг друга на аппаратном уровне дисплея на последовательных VBlank.
            - **Непрерывное мигание индикатора и плавность 60 FPS**: Зелёная точка индикатора теперь стабильно отображается на каждом сгенерированном кадре, подтверждая 100% доставку всех кадров на экран без разрывов и пропусков.

            ### 2. Сохранение максимального качества DIS-Flow
            - Все алгоритмы наивысшего качества (12-точечная TV-L1 диффузия с консенсусным фильтром и фотометрический fallback) сохранены на 100%.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
