name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.6
          name: "SkyFrame v1.0.6 for Steam Deck"
          body: |
            ## 🚀 SkyFrame v1.0.6 — Устранение белого экрана (Синхронизация семафоров и Ring Buffer)

            ### Что исправлено в v1.0.6:
            - **Устранение белого экрана (Semaphore Chain Fix):** ранее промежуточный `vkQueueSubmit` ожидал семафор завершения отрисовки игры, сбрасывая его в 0. При последующем вызове презентации оригинального кадра дисплейный сервер Gamescope зависал в бесконечном ожидании уже сброшенного семафора, вызывая белый экран. Теперь `vkQueueSubmit` генерирует **два независимых сигнальных семафора** (`interDoneSemaphore` и `finalDoneSemaphore`) для каждого из вызовов Present.
            - **Кольцевой буфер командных буферов (Ring Buffer x4):** выделен пул из 4 независимых командных буферов и наборов семафоров для полного устранения гонок данных между кадрами в GPU.
            - **Правильное сопоставление `waitDstStageMask`:** устранён баг чтения за границами массива стадий конвейера при несовпадающем числе семафоров.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
