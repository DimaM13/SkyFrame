name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.3
          name: "SkyFrame v1.1.3 for Steam Deck"
          body: |
            ## 🚀 SkyFrame v1.1.3 — Автоматическая герцовка (Auto VSync Cadence) и устранение мерцания блоков

            ### Что нового в v1.1.3:
            - **Автоматическая синхронизация с герцовкой экрана (Auto VSync Cadence):** плагин автоматически определяет выставленную в боковом меню SteamOS герцовку (60, 90, 45, 40 Гц и др.) и блокирует базовый темп игры ровно на половину частоты экрана (30 FPS для 60 Гц, 45 FPS для 90 Гц, 20 FPS для 40 Гц), догенерируя остальные кадры до полной герцовки. Даже если игра выдает 40 FPS без ограничения, SkyFrame стабилизирует базовые кадры на 30 FPS и выводит сгенерированные кадры с идеальным шагом ровно 16.67 мс, полностью устраняя 3:2 pull-down микрофризы и подергивания!
            - **Ликвидация мерцающих пикселей и квадратов (8x8 Block Flicker Fix):** в шейдере `warp_blend.comp` расширена выборка с 9 до 16 точек (равномерная сетка 4x4) и удален сброс векторов `minVal > 0.55 * 9.0`, приводивший к мигающим квадратам на листве и тенях при движении.
            - **Мягкое растворение швов и окклюзий (Soft Disocclusion Fade):** границы блоков и несовпадающие пиксели теперь плавно растворяются в резкий нативный кадр $F_1$, исключая видимые контуры блоков.
            - **Мгновенное переключение генерации в меню Decky:** опрос конфигурации переведен на наносекундную точность (`st_mtim.tv_nsec`), включение и отключение генерации в меню Quick Access применяется за миллисекунды без пропуска нажатий.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
