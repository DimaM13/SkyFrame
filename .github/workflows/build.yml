name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.1
          name: "SkyFrame v1.5.1 — 90% High-Density Optical Flow & In-Game Resolution Slider"
          body: |
            ## 🚀 SkyFrame v1.5.1 — 90% High-Density Optical Flow & Интерактивный ползунок в Decky

            В этом обновлении мы кардинально улучшили качество интерполяции и устранили блочные артефакты:

            ### 1. Плотная сетка движения 90% от нативного разрешения (High-Density Optical Flow)
            - **По умолчанию 90%**: размер плотного поля движения увеличен с $320 \times 200$ до $1152 \times 720$ (при 800p).
            - Каждый пиксель получает практически индивидуальный вектор движения. Крупные блочные артефакты физически устранены.
            - **Плавная фиксация нулевого смещения (Smooth Zero-Bias)**: устранен пороговый клифф в грубом поиске, исключая шахматные разрывы на слабоконтрастных поверхностях.
            - **13-точечный крестообразный поиск с субпиксельным уточнением**: тонкая адаптация векторов вокруг базового направления.

            ### 2. Интерактивный ползунок разрешения потока в Decky-плагине (In-Game Dynamic Slider)
            - Новый ползунок в боковой панели Quick Access Menu: **"Разрешение потока движения"** (от 50% до 100%, шаг 5%, по умолчанию 90%).
            - **Мгновенный Hot-Reload**: изменение разрешения применяется на лету прямо во время игры без перезапуска приложения и без пересоздания Swapchain!

            ### 3. Проверенная стабильная архитектура слоя v1.1.3
            - Промежуточный кадр выводится мгновенно ($t=0$), реальный кадр выводится фоновым потоком с точным интервалом ($t=16.67$ мс).
            - **0.0% нагрузки на CPU**: фоновый воркер использует системный `sleep_until` без удержания мьютекса.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
