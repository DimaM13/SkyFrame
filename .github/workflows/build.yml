name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8.3
          name: "SkyFrame v1.8.3 — 2-Level Hierarchical DIS-Flow (True 60 FPS Camera Pan Smoothness)"
          body: |
            ## 🚀 SkyFrame v1.8.3 — Иерархический оптический поток (2-Level Hierarchical DIS-Flow)

            В этом обновлении устранена проблема визуального ощущения 30 FPS при поворотах камеры:

            ### 1. Иерархический поиск движения (Coarse-to-Fine)
            - **Расширение радиуса поиска до $\pm 136$ экранных пикселей**: Ранее сиды были ограничены 40 экранными пикселями, из-за чего при любом быстром движении камеры или мыши оптический поток срывался, а генератор откатывался в дублирование кадров (30 FPS). Теперь 64-кандидатный банк покрывает любые быстрые панорамы и вращения камеры в играх.
            - **Коллаборативный поиск на уровне рабочей группы (LDS Shared Memory)**: 64 потока тайла параллельно оценивают 64 кандидата за микросекунды с аппаратной параллельной редукцией в разделяемой памяти.
            - **Субпиксельный градиентный спуск**: Локальное уточнение с точностью до 0.05 пикселя устраняет размытие и «желе».
            - **Защита HUD и интерфейса**: Приоритетный сид (0,0) гарантирует отсутствие двоения и размытия статических элементов интерфейса.

            ### 2. Синхронная аппаратная доставка кадров по VBlank
            - Сохранён 100% стабильный синхронный конвейер доставки кадров без фоновых потоков и конфликтов на `VkQueue`.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
