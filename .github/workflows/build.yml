name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.3
          name: "SkyFrame v1.3.3 — 100% Pure v1.1.3 Layer Architecture with Upgraded 360° Optical Flow"
          body: |
            ## 🚀 SkyFrame v1.3.3 — 100% Pure v1.1.3 Layer Architecture with Upgraded 360° Optical Flow

            Все исходные файлы слоя `layer/` на 100% возвращены к стабильной версии **v1.1.3** (`877c516`):

            ### 1. 100% стабильная архитектура слоя v1.1.3
            - Код Vulkan-слоя (`layer/skyframe_layer.cpp`, `layer/frame_pacer.cpp`, `layer/frame_pacer.h`) полностью совпадает с версией v1.1.3, где кадры всегда стабильно выводились на экран.
            - Единый вычислительный конвейер, оригинальные тайминги и управление очередью `DrainPendingPresents`.

            ### 2. Новые улучшенные шейдерные алгоритмы (`warp_blend.comp`)
            - **360-градусное круговое покрытие (64 кандидата)** на 7 скоростных радиусах (от 2 до 48 px) вместо старых 49.
            - **Фиксация нулевого вектора на однородных текстурах**: на небе, траве, стенах и асфальте вектор надежно фиксируется в (0,0), что устраняет плавающие и мерцающие «квадраты».
            - **Субпиксельная подгонка каждого пикселя**: адаптация вектора под точные контуры движущихся объектов.
            - **Мягкий сигмоидный блендинг**: плавный переход без резких ступенек и видимых границ блоков.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
