name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Build NCNN Vulkan Static Library (64-bit)
        run: |
          git clone --recursive --depth 1 https://github.com/Tencent/ncnn.git
          cd ncnn
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DNCNN_VULKAN=ON \
            -DNCNN_SIMPLEVK=OFF \
            -DNCNN_SYSTEM_GLSLANG=OFF \
            -DNCNN_BUILD_EXAMPLES=OFF \
            -DNCNN_BUILD_TESTS=OFF \
            -DNCNN_BUILD_BENCHMARK=OFF \
            -DNCNN_BUILD_TOOLS=OFF \
            -DNCNN_OPENMP=OFF \
            -DNCNN_SHARED_LIB=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/ncnn_install
          cmake --build . --config Release -j$(nproc)
          cmake --install .
          cd ../..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build with NCNN Vulkan RIFE FlowNet
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release -DNCNN_DIR=$GITHUB_WORKSPACE/ncnn_install
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build (fallback compute shader for 32-bit games)
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_NCNN=OFF -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.8
          name: "SkyFrame v1.1.8 for Steam Deck (Critical Fix: Downstream Command Dispatch & Zero Loader Trampolines)"
          body: |
            ## 🚀 SkyFrame v1.1.8 — Полное устранение ошибки Invalid Command Buffer и вывод кадров на экран

            ### Что исправлено в v1.1.8:
            - **Устранен краш `vkCmdPipelineBarrier: Invalid commandBuffer`:** все вызовы Vulkan внутри `VulkanWarper` переведены на прямое выполнение через таблицу диспетчеризации драйвера устройства (`WarperDeviceDispatch` через `vkGetDeviceProcAddr`).
            - **Полный обход трамплина `libvulkan.so`:** команды пайплайна, копирования текстур, push-констант и dispatch теперь направляются напрямую в драйвер RADV/Mesa без валидации глобального загрузчика Vulkan.
            - **Гарантированный вывод кадров:** устранено зависание и падение до 0 FPS при вызове первого ReadbackDownsample/Warp. Полноценная интерполяция 30 -> 60 FPS через RIFE FlowNet + FastWarp.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
