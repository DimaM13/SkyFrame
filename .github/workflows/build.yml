name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.0
          name: "SkyFrame v1.4.0 — Dense Bilinear 4x4 Optical Flow (Zero Squares)"
          body: |
            ## 🚀 SkyFrame v1.4.0 — Вариант Б: Плотный билинейный оптический поток 4×4 (Dense Bilinear Flow)

            Полное устранение макро-блоков и видимых «квадратов» при сохранении 100% стабильности вывода кадров:

            ### 1. Непрерывное векторное поле движения 4×4 (в 4 раза плотнее)
            - **Pass 1 (`motion_field.comp`)**: расчет карты векторов движения по сверхплотной сетке 4×4 пикселя ($320 \times 200 = 64\,000$ векторов на 1280×800) с круговым 360-градусным поиском по 64 кандидатам и параллельной редукцией в LDS.
            - **Pass 2 (`warp_blend.comp`)**: непрерывная 4-точечная билинейная интерполяция вектора между центрами окружающих блоков для **каждого отдельного пикселя**. Между соседними пикселями больше нет блочных разрывов и ступенек ($C^0$-непрерывность).
            - **Защита плоских поверхностей**: жесткая фиксация в $(0, 0)$ на небе, стенах, траве и асфальте.
            - **Субпиксельный доводчик**: микро-подгонка субпикселей на высококонтрастных границах.
            - **Мягкий сигмоидный блендинг**: бесшовный переход цветов без артефактов наложения.

            ### 2. Проверенная стабильная архитектура слоя v1.1.3
            - Сохранена оригинальная логика пейсинга: промежуточный кадр выводится мгновенно ($t=0$), реальный кадр выводится фоновым потоком с точным интервалом ($t=16.67$ мс).
            - **0.0% нагрузки на CPU**: фоновый воркер использует системный `sleep_until` без удержания мьютекса (полностью устранен жор CPU).
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
