name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  LSFGVK_VERSION: "2.0.0"
  LSFGVK_URL: "https://builds.lsfg-vk.dev/lsfg-vk-2.0.0.tar.xz"

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib libvulkan-dev python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: decky-plugin/package-lock.json

      - name: Verify backend syntax
        run: |
          python3 -m py_compile decky-plugin/main.py scripts/package_decky_zip.py
          echo "PY_OK"

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm ci
          npm run build
          test -f dist/index.js || (echo "dist/index.js missing after build!" && exit 1)
          cd ..

      # Engine core = official lsfg-vk prebuilts (Ubuntu 22.04, same as this
      # runner). Our engine/lsfg tree is a stale dev snapshot whose shader
      # registry no longer matches the current Steam lsfg-vk.dll, so we ship
      # upstream binaries as a dependency (no source fork involved).
      - name: Fetch official lsfg-vk engine core
        run: |
          mkdir -p /tmp/lsfgvk-official
          curl -L -o /tmp/lsfgvk.tar.xz "$LSFGVK_URL"
          tar -tf /tmp/lsfgvk.tar.xz
          tar -xJf /tmp/lsfgvk.tar.xz -C /tmp/lsfgvk-official
          find /tmp/lsfgvk-official -type f | sort

      - name: Build SkyFrame shim layer (64-bit + 32-bit)
        run: |
          cmake -S engine/skyframe -B build-shim64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-shim64 --config Release -j$(nproc)
          cmake -S engine/skyframe -B build-shim32 -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_C_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build build-shim32 --config Release -j$(nproc)
          find build-shim64 build-shim32 -name "*.so" | sort

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin

          # Official lsfg-vk 2.0.0 core (FG engine).
          cp /tmp/lsfgvk-official/lib/liblsfg-vk-layer.so decky-plugin/bin/liblsfg-vk-layer.so
          cp /tmp/lsfgvk-official/lib/liblsfg-vk-layer.x86.so decky-plugin/bin/liblsfg-vk-layer_32.so
          cp /tmp/lsfgvk-official/bin/lsfg-vk-cli decky-plugin/bin/lsfg-vk-cli
          chmod +x decky-plugin/bin/lsfg-vk-cli || true
          # Own SkyFrame present-tap layer (live HUD stats; forward-only).
          cp build-shim64/libskyframe-shim.so decky-plugin/bin/libskyframe-shim.so
          cp build-shim32/libskyframe-shim.so decky-plugin/bin/libskyframe-shim_32.so
          # Isolated per-game launcher (installed to ~/.local/bin by main.py)
          chmod +x decky-plugin/skyframe-run || true

          echo "=== arch check (1=32bit, 2=64bit) ==="
          python3 -c "
          for f in ['decky-plugin/bin/liblsfg-vk-layer.so','decky-plugin/bin/liblsfg-vk-layer_32.so','decky-plugin/bin/lsfg-vk-cli','decky-plugin/bin/libskyframe-shim.so','decky-plugin/bin/libskyframe-shim_32.so']:
              d = open(f,'rb').read(6)
              assert d[:4] == b'\x7fELF', f
              print(f, 'class:', d[4])
          "
          test -f decky-plugin/bin/libskyframe-shim.so || (echo "shim 64 missing!" && exit 1)
          test -f decky-plugin/bin/libskyframe-shim_32.so || (echo "shim 32 missing!" && exit 1)
          test -f decky-plugin/bin/liblsfg-vk-layer.so || (echo "64-bit layer missing!" && exit 1)
          test -f decky-plugin/bin/liblsfg-vk-layer_32.so || (echo "32-bit layer missing!" && exit 1)
          test -f decky-plugin/bin/lsfg-vk-cli || (echo "CLI missing!" && exit 1)
          ls -la decky-plugin/bin

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py
          echo "=== SkyFrame.zip contents ==="
          python3 -c "import zipfile; print('\n'.join(sorted(zipfile.ZipFile('SkyFrame.zip').namelist())))"

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: SkyFrame.zip
          generate_release_notes: true
          body: |
            ## 🚀 SkyFrame ${{ github.ref_name }} — готовый пакет для Steam Deck

            **Установка в 1 шаг:** скачай `SkyFrame.zip` → Decky Loader → Настройки → Developer → `Install Plugin from Zip` → выбери файл → перезапусти Deck.

            ### Что внутри (все готовое, собирать ничего не нужно)
            - Официальное ядро **lsfg-vk 2.0.0** (prebuilt): 64/32-bit Vulkan-слой + `lsfg-vk-cli` (`healthcheck`, `validate`, `benchmark`). Ядро PancakeTAS, используется как зависимость.
            - `skyframe-run` — изолированный лаунчер: `~/.local/bin/skyframe-run %command%`
            - Свой слой `VK_LAYER_SKYFRAME_frame_generation` — present-tap (forward-only + живой замер FPS/джи́ттера для HUD)
            - Decky UI: HUD `base→output`, live-toggle, Adaptive, доставка Smooth/Balanced/Low-lag (режимы доставки — в `~/.config/skyframe/skyframe.toml`, для будущего полного слоя)

            ### Требования
            Lossless Scaling в Steam → Свойства → Бета-версии → ветка **`lsfg-vk`**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
