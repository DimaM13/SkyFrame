name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.1
          name: "SkyFrame v1.2.1 for Steam Deck"
          body: |
            ## 🚀 SkyFrame v1.2.1 — VBlank Spacing: идеальный плоский фреймтайм и вывод сгенерированных кадров

            ### Что исправлено в v1.2.1:
            - **Межкадровая задержка VBlank Spacing (Gamescope Fix):**
              - В v1.2.0 отправка сгенерированного и нативного кадров происходила дуплетом за 0.05 мс, из-за чего композитор Gamescope считал первый кадр устаревшим и затирал его вторым до обновления экрана.
              - В v1.2.1 между отправкой промежуточного кадра и настоящего кадра внедрена точная задержка ровно в 1 такт VBlank (16.67 мс на 60 Гц / 11.11 мс на 90 Гц) через `HighPrecisionSleepUntil`.
              - Теперь Gamescope гарантированно выводит промежуточный кадр на экран (зеленый тестовый маркер отображается в углу, на экране честные плавные 60/90 FPS).
            - **Идеально плоский график фреймтайма (MangoHud Frametime Fix):**
              - Полностью устранен эффект «пилы» / «расчёски» в оверлее SteamOS: интервал между всеми вызовами теперь строго равен 16.67 мс (60 Гц) или 11.11 мс (90 Гц), график оверлея превратился в идеально ровную горизонтальную линию.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
