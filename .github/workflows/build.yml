name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "SkyFrame v1.1.0 for Steam Deck"
          body: |
            ## 🚀 SkyFrame v1.1.0 — Безопасное переключение на лету (Hot-Reloading), сброс очередей и живая телеметрия

            ### Что нового в v1.1.0:
            - **Мгновенное переключение на лету (Hot-Reloading):** теперь включать/отключать генерацию кадров, переключать режимы и тумблер визуального HUD-маркера можно прямо во время игры в меню Decky Loader без зависаний, вылетов и перезапуска игры!
            - **Корректный сквозной пропуск (Clean Passthrough):** при отключении генерации слой аккуратно досбрасывает (`DrainPendingPresents`) оставшиеся кадры из фонового потока, сбрасывает пейсер (`ctx->pacer.Reset()`) и отслеживание (`prevGameIdx = UINT32_MAX`), переводя вывод в чистый сквозной режим без задержек.
            - **Синхронизация через мьютекс очереди (`queueMutex`):** вызов оригинальной презентации при отключенном режиме защищен единым мьютексом очереди, исключая состояние гонки (Race Condition) с фоновым потоком.
            - **Постоянная регистрация слоев без удаления манифестов:** устранена критическая ошибка, при которой выключение генерации удаляло JSON-манифесты с диска на лету при запущенном Gamescope. Манифесты остаются зарегистрированными, а отключение происходит внутри слоя.
            - **Атомарная запись конфигурации:** запись `config.json` в плагине Decky теперь выполняется атомарно через временный файл (`os.replace`), исключая чтение частично записанного файла.
            - **Живой экспорт телеметрии FPS:** слой экспортирует актуальный базовый и выходной FPS в `/tmp/skyframe_stats.json` для отображения реальной статистики.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
