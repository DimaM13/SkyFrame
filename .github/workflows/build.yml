name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8.0
          name: "SkyFrame v1.8.0 — Pure Hardware FIFO Frame Delivery & Zero Dropped Frames"
          body: |
            ## 🚀 SkyFrame v1.8.0 — Чистая аппаратная доставка кадров через Vulkan FIFO (Zero Dropped Frames)

            В этом обновлении мы полностью перевели доставку кадров на аппаратный уровень Vulkan:

            ### 1. Аппаратная доставка кадров через `VK_PRESENT_MODE_FIFO_KHR`
            - **Принудительный режим FIFO для Swapchain**: Спецификация Vulkan гарантирует, что в режиме `VK_PRESENT_MODE_FIFO_KHR` каждый отправленный кадр ставится в аппаратную очередь и выводится строго на следующем такте VBlank развёртки дисплея (каждые 16.67 мс при 60 Гц).
            - **Ликвидация фонового потока и таймеров**: Полностью удалены фоновый рабочий поток, функции засыпания `sleep_for`, таймеры и мьютексы задержки. Промежуточный кадр ($F_{N-0.5}$) и игровой кадр ($F_N$) отправляются в очередь Vulkan строго последовательно в едином вызове.
            - **Исключение инверсии времени и сбросов Gamescope**: Устранены ситуации, когда Gamescope в режиме Mailbox сбрасывал промежуточный кадр или когда фоновый поток запаздывал. Зелёная точка мигает непрерывно, 100% кадров выводятся на экран.

            ### 2. Сохранение максимального качества DIS-Flow
            - Все алгоритмы максимального качества оптического потока (12-точечная 2-Ring TV-L1 диффузия с подавлением выбросов консенсусом и фотометрический предохранитель окклюзий) сохранены в полном объёме.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
