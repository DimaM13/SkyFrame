name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32" -DLSFGVK_BUILD_CLI=OFF
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin

          # Copy LSFG engine binaries
          find build64 -name "liblsfg-vk-layer.so" -exec cp {} decky-plugin/bin/liblsfg-vk-layer.so \;
          find build32 -name "liblsfg-vk-layer.so" -exec cp {} decky-plugin/bin/liblsfg-vk-layer_32.so \;
          find build64 -name "VkLayer_LSFGVK_frame_generation.json" -exec cp {} decky-plugin/bin/VkLayer_LSFGVK_frame_generation.json \;
          find build64 -name "lsfg-vk-cli" -type f -exec cp {} decky-plugin/bin/lsfg-vk-cli \;
          chmod +x decky-plugin/bin/lsfg-vk-cli || true

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.9.1
          name: "SkyFrame v1.9.1 — Native Lossless Scaling (LSFG) for Steam Deck"
          body: |
            ## ⚡ SkyFrame v1.9.1 — Нативный Lossless Scaling (LSFG) для Steam Deck & Linux

            В этом обновлении весь устаревший экспериментальный код шейдеров был полностью удален. SkyFrame теперь работает исключительно на проверенном нейросетевом движке **Lossless Scaling (LSFG)**!

            ---

            ### 🚀 Главные возможности
            - **Нативный Vulkan-слой LSFG**: Генерация промежуточных кадров выполняется напрямую через Vulkan Compute шейдеры нейросети LSFG при перехвате `vkQueuePresentKHR`.
            - **Аппаратный FP16 Rapid Packed Math**: Аппаратное ускорение половинной точности на RDNA2 GPU Steam Deck — инференс занимает всего ~4–6 мс на кадр.
            - **Множители 2x, 3x, 4x**: Плавный выбор между удвоением, утроением и учетверением кадров (30 → 60 FPS, 30 → 90 FPS на OLED, 45 → 90 FPS).
            - **Автоматический поиск Lossless.dll**: Плагин самостоятельно находит вашу купленную лицензионную копию Lossless Scaling в Steam (на внутреннем накопителе и MicroSD).
            - **Полная поддержка 64-bit и 32-bit**: Скомпилированы слои под обе разрядности (`liblsfg-vk-layer.so` и `liblsfg-vk-layer_32.so`).
            - **Встроенная утилита диагностики**: Добавлена CLI-утилита `lsfg-vk-cli` для быстрой проверки конфигурации и целостности.

            ### 📋 Как использовать
            1. В клиенте Steam откройте свойства купленного **Lossless Scaling**:
               `Свойства -> Бета-версии -> Выберите ветку "lsfg-vk"`.
            2. Установите `SkyFrame.zip` через Decky Loader.
            3. В меню SkyFrame включите генерацию кадров, выберите множитель (2x / 3x / 4x) и режим FP16.
            4. В свойствах игры укажите параметр запуска:
               `ENABLE_LSFGVK=1 %command%`
               (Либо включите **«Глобальный режим»** в плагине, чтобы LSFG инжектировался во все игры автоматически).
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
