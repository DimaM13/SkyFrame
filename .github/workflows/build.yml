name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "SkyFrame v1.0.3 for Steam Deck"
          body: |
            ## 🚀 SkyFrame v1.0.3 — Нативный генератор кадров для Steam Deck

            ### Что нового в v1.0.3:
            - **Экспорт `vkNegotiateLoaderLayerInterfaceVersion`:** добавлен канонический переговорный интерфейс Vulkan Loader, благодаря чему слой теперь корректно опознаётся современным загрузчиком Vulkan в SteamOS и Proton.
            - **Полноценная поддержка 32-битных (x86) и 64-битных (x86_64) игр:** скомпилированы обе версии слоя (`libVkLayer_skyframe.so` и `libVkLayer_skyframe_32.so`). Работает как Supreme Commander 2, так и Cyberpunk.
            - **Обход песочницы Proton:** авто-установка в системный каталог `~/.local/lib/`.
            - **Кнопки в меню Decky:** мгновенное копирование параметров запуска в один клик.
            - **Логирование:** прямо в `~/.local/share/skyframe/skyframe.log`.

            ### 📦 Установка на Steam Deck:
            1. Скачайте прикреплённый архив **`SkyFrame.zip`** на Steam Deck.
            2. В меню **Decky Loader** зайдите в Настройки ⚙️ -> **Режим разработчика** (Developer Mode).
            3. Нажмите **«Install plugin from zip»** и выберите скачанный `SkyFrame.zip`.
            4. В свойствах любой игры в Steam укажите:
               `ENABLE_SKYFRAME=1 %command%`
               *(можно скопировать кнопкой прямо из плагина в меню `...`)*.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
