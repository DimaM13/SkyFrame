name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: decky-plugin/package-lock.json

      - name: Verify backend syntax
        run: |
          python3 -m py_compile decky-plugin/main.py scripts/package_decky_zip.py
          echo "PY_OK"

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm ci
          npm run build
          test -f dist/index.js || (echo "dist/index.js missing after build!" && exit 1)
          cd ..

      - name: Compile 64-bit Vulkan Layer + CLI
        run: |
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Compile 32-bit Vulkan Layer (multilib, no CLI)
        run: |
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32" -DLSFGVK_BUILD_CLI=OFF
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin

          # 64-bit + 32-bit layer libraries (32-bit stored as _32, picked by main.py)
          find build64 -name "liblsfg-vk-layer.so" -exec cp {} decky-plugin/bin/liblsfg-vk-layer.so \;
          find build32 -name "liblsfg-vk-layer.so" -exec cp {} decky-plugin/bin/liblsfg-vk-layer_32.so \;
          find build64 -name "lsfg-vk-cli" -type f -exec cp {} decky-plugin/bin/lsfg-vk-cli \;
          chmod +x decky-plugin/bin/lsfg-vk-cli || true
          # Isolated per-game launcher (installed to ~/.local/bin by main.py)
          chmod +x decky-plugin/skyframe-run || true

          echo "=== decky-plugin/bin ==="
          ls -la decky-plugin/bin
          test -f decky-plugin/bin/liblsfg-vk-layer.so || (echo "64-bit layer missing!" && exit 1)
          test -f decky-plugin/bin/liblsfg-vk-layer_32.so || (echo "32-bit layer missing!" && exit 1)
          test -f decky-plugin/bin/lsfg-vk-cli || (echo "CLI missing!" && exit 1)

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py
          echo "=== SkyFrame.zip contents ==="
          python3 -c "import zipfile; print('\n'.join(sorted(zipfile.ZipFile('SkyFrame.zip').namelist())))"

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: SkyFrame.zip
          generate_release_notes: true
          body: |
            ## 🚀 SkyFrame ${{ github.ref_name }} — готовый пакет для Steam Deck

            **Установка в 1 шаг:** скачай `SkyFrame.zip` → Decky Loader → Настройки → Developer → `Install Plugin from Zip` → выбери файл → перезапусти Deck.

            ### Что внутри (все готовое, собирать ничего не нужно)
            - `liblsfg-vk-layer.so` + `liblsfg-vk-layer_32.so` — 64/32-bit Vulkan-слой (ядро lsfg-vk 2.0: bindless pipeline, FP16, ~30% VRAM)
            - `lsfg-vk-cli` — диагностика (`healthcheck`, `validate`, `benchmark`)
            - `skyframe-run` — изолированный лаунчер: `~/.local/bin/skyframe-run %command%`
            - Свой слой `VK_LAYER_SKYFRAME_frame_generation` (манифесты ставит плагин)
            - Decky UI v2: HUD `base→output`, live-toggle, Adaptive, доставка Smooth/Balanced/Low-lag

            ### Требования
            Lossless Scaling в Steam → Свойства → Бета-версии → ветка **`lsfg-vk`**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
