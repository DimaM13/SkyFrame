name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8.4
          name: "SkyFrame v1.8.4 — FSR 3 Robust Warping (Catmull-Rom, 3x3 Color Clamping & Median Flow Cleaning)"
          body: |
            ## 🚀 SkyFrame v1.8.4 — Математический стек FSR 3 (Vector Cleaning & Robust Warping)

            В этом обновлении внедрены проверенные решения из AMD FidelityFX (FSR 3 Frame Generation):

            ### 1. Очистка векторов движения (3x3 Vector Median Filter)
            - **Ликвидация «квадратов» и точечных аномалий**: Перед вариационным сглаживанием в `dis_smooth.comp` векторы сырого потока фильтруются через частичную сортировочную сеть 3x3. Медиана по модулю скорости моментально отсекает изолированные ошибочные векторы, из-за которых появлялись редкие квадраты.
            - **Двухуровневый поиск сохранен**: Диапазон охвата $\pm 136$ пикселей экрана для идеальной плавности при поворотах камеры.

            ### 2. Надежный синтез кадра (FSR 3 Robust Warping)
            - **5-точечный Catmull-Rom сэмплинг**: Заменяет размытую билинейную фильтрацию. Текстуры, надписи и мелкие детали сохраняют естественную резкость.
            - **3x3 Color Clamping (AABB)**: Вычисляется локальный цветовой бокс $[\min, \max]$ из 9 соседних пикселей текущего кадра. Деформированный пиксель зажимается в этот диапазон (`clamp(c0, minCol, maxCol)`), что на 100% блокирует появление кислотных артефактов и шлейфов на краях силуэтов.
            - **Photometric Cross-Fade Fallback**: При сильном разрыве цветов шейдер плавно подмешивает нативный бленд реальных кадров ($0.5 \cdot I_0 + 0.5 \cdot I_1$) без геометрических разрывов.

            ### 3. Синхронная аппаратная доставка кадров по VBlank
            - Сохранён 100% стабильный синхронный конвейер доставки кадров по VBlank на основном потоке.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
