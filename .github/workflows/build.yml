name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "SkyFrame v1.2.0 for Steam Deck"
          body: |
            ## 🚀 SkyFrame v1.2.0 — Архитектура MAKO: Синхронный FIFO Present и 64-поточный оптический поток

            ### Что нового в v1.2.0:
            - **Синхронный показ кадров уровня MAKO (Synchronous FIFO Presentation):**
              - В `vkCreateSwapchainKHR` принудительно задействован режим `VK_PRESENT_MODE_FIFO_KHR` с расширенным пулом буферов (`minImageCount >= 4`).
              - Полностью удален фоновый поток `PresentWorkerLoop` и задержки ожидания `condition_variable`.
              - Теперь промежуточный ($F_{N-0.5}$) и настоящий ($F_N$) кадры отправляются на презентацию последовательно в основном потоке рендеринга. Видеоподсистема SteamOS (Gamescope / VBlank) сама аппаратно распределяет их на последовательные такты VBlank (VBlank 1 и VBlank 2), полностью исключая джиттер планировщика потоков Linux!
            - **Железный пейсер базового темпа (Top-of-Present RealFramePacer):**
              - Внедрен алгоритм `Schedule` с привязкой к дедлайнам $T_{base} = \frac{2}{Hz}$ (30 FPS для 60 Гц, 45 FPS для 90 Гц, 20 FPS для 40 Гц).
              - Если движок игры завершил кадр раньше, вызов `vkQueuePresentKHR` удерживает поток игры с субмикросекундной точностью, заставляя игру работать с идеальным базовым ритмом.
              - При задержках или лагах рендеринга таймер мгновенно перебазируется (`rebase`), исключая лавинообразные всплески кадров.
            - **64-поточный Compute Shader с субпиксельным уточнением (64-Candidate Optical Flow):**
              - Количество кандидатов движения расширено до 64 (радиус поиска увеличен до 48 пикселей для захвата резких поворотов камеры).
              - Задействована параллельная 2-шаговая редукция поиска минимума в shared-памяти за считанные такты.
              - Добавлено попиксельное уточнение векторов на границах движущихся объектов (`Per-Pixel Fine Edge Refinement`), устраняющее блочность и ступенчатость.
            - **Мягкое растворение окклюзий (Smooth Dissolve):**
              - Использование функции `smoothstep` для бесшовного растворения проблемных зон в резкий нативный кадр $F_1$.
            - **100% стабильность в видеопамяти (Zero Crashes):**
              - Все вычисления производятся исключительно в VRAM через SPIR-V Compute Shaders без передачи кадров в CPU.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
