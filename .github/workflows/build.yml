name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.9
          name: "SkyFrame v1.0.9 for Steam Deck"
          body: |
            ## 🚀 SkyFrame v1.0.9 — Исправление зависания WSI, безопасная презентация и Compute Forward Extrapolation

            ### Что исправлено в v1.0.9:
            - **Устранение зависания Gamescope WSI на 1-м кадре:** восстановлен корректный порядок презентации Vulkan WSI. Реальный кадр игры `currentGameIdx` отдается мгновенно ($t = 0$) в вызове приложения (ноль задержки ввода, полная синхронизация с DXVK). Сгенерированный промежуточный кадр выводится фоновым потоком ровно на середине шага ($t = 16.7$ мс).
            - **Исправление генерации шейдерных заголовков:** исправлено имя заголовочного файла в CMake (`warp_blend_comp_spv.h`), благодаря чему аппаратный Compute Shader теперь реально компилируется и внедряется в бинарник.
            - **Экстраполяция движения вперед (Forward Motion Extrapolation):** вместо статичного дубликата или шагов назад во времени Compute-шейдер проецирует смещение пикселей вперед на $+0.5$ такта с защитой от артефактов на резких срезах сцены.
            - **Динамическая инициализация Image Views:** создание `VkImageView` для свопчейна теперь безопасно вызывается как при создании, так и при получении картинок от игры, с полной проверкой диапазонов памяти.
            - **Визуальный HUD-маркер доставки кадров:** тумблер в меню Decky выводит неоново-зеленый маркер на каждом сгенерированном кадре, позволяя своими глазами убедиться, что они физически идут на экран.
            - **Штатное энергопотребление (12–14W):** сохранен высокоточный сон ядра Linux (`sleep_until`) без жора процессора.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
