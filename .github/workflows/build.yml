name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0
          name: "SkyFrame v1.3.0 — Path B: Pure GPU FIFO Pacing & 3-Pass Regularized Optical Flow"
          body: |
            ## 🚀 SkyFrame v1.3.0 — Path B: Pure GPU Hardware FIFO Pacing & 3-Pass Regularized Optical Flow

            В версии 1.3.0 произведена полная модернизация архитектуры синхронизации и шейдерного конвейера оптического потока на основе анализа архитектуры `lsfg-vk 2.0.0`:

            ### 1. Аппаратная синхронизация GPU FIFO (Zero-Lag & Zero-CPU Overhead)
            - **Ликвидирован CPU spin-wait поток**: удален фоновый воркер-поток с циклом активного ожидания `__builtin_ia32_pause()`, который загружал одно ядро процессора Steam Deck на 100% и вызывал просадки и нагрев APU.
            - **Прямой двойной Present через Vulkan Semaphores**: оба кадра (сгенерированный \(F_{N-0.5}\) и реальный \(F_N\)) отправляются в свопчейн Gamescope последовательными вызовами `vkQueuePresentKHR` с аппаратными семафорами синхронизации рендера (`interDoneSemaphore` и `finalDoneSemaphore`).
            - **Аппаратный пейсинг Gamescope FIFO**: композитор Gamescope (`VK_PRESENT_MODE_FIFO_KHR`) самостоятельно выводит кадры на каждый такт аппаратного VBlank экрана (каждые 16.67 мс при 60 Гц или 11.1 мс при 90 Гц на OLED) без задержек и без нагрузки на CPU.

            ### 2. 3-проходный конвейер оптического потока с регуляризацией (Zero Macroblock Artifacts)
            - **Круговое 360° покрытие векторов (`motion_field.comp`)**:
              - Сетка из 64 кандидатов движения охватывает все направления по 360° на 7 радиусах скорости (от 2 до 48 пикселей) с плотными субпиксельными радиусами. Полностью устранены угловые слепые зоны при вращении камеры.
            - **Новый пространственный 3x3 медианный фильтр векторов (`flow_filter.comp`)**:
              - Промежуточный проход вычисляет медиану векторов соседних блоков 3x3 (`median9`).
              - Полностью устраняет изолированные шумовые блоки, «квадраты» и разрывы на однородных текстурах (небо, трава, стены, асфальт).
            - **Мягкий сигмоидный блендинг и билинейный варп (`warp_blend.comp`)**:
              - Жесткий порог отсечения заменен на плавную непрерывную функцию затухания `clamp(1.0 - smoothstep(0.12, 0.45, bestDiff), 0.20, 1.0)`.
              - Никаких резких ступенек и видимых границ блоков при быстрых движениях.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
