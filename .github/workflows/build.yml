name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.6.0
          name: "SkyFrame v1.6.0 — DIS-Flow (Dense Inverse Search) + TV-L1 Variational Regularization (Zero Blocks)"
          body: |
            ## 🚀 SkyFrame v1.6.0 — DIS-Flow (Dense Inverse Search) + Вариационная диффузия TV-L1 (Полное устранение квадратов)

            В этом фундаментальном обновлении мы полностью отказались от блочного перебора кандидатов (Block Matching) и перешли на золотой стандарт непрерывного оптического потока — **DIS-Flow (Dense Inverse Search)** с **вариационной диффузией TV-L1 (Laplacian Regularization)**:

            ### 1. Непрерывный оптический поток DIS-Flow (Аналитический градиентный спуск)
            - **Pass 0 (`dis_gradient.comp`)**: Вычисление яркости и пространственных градиентов Собеля ($I_x, I_y$), а также предвычисление элементов тензора структуры и обратного Гессиана $H^{-1}$.
            - **Pass 1 (`dis_search.comp`)**: Непрерывный аналитический инверсный градиентный спуск с шагом $\Delta \vec{v} = - H^{-1} \sum \nabla I_0 \cdot \Delta I$. Векторы движения вычисляются в непрерывных вещественных координатах. Больше никаких дискретных соревнующихся блоков!
            - **Pass 2 (`dis_smooth.comp`)**: Вариационная эластичная диффузия TV-L1 (Laplacian Regularization). «Сшивает» векторное поле в монолитное эластичное полотно с сохранением бритвенно-чётких границ объектов. Любые изолированные выбросы и квадраты физически растворяются.
            - **Pass 3 (`warp_blend.comp`)**: Непрерывный симметричный двунаправленный варп ($-\vec{v}/2, +\vec{v}/2$) с мягким затуханием окклюзий и защитой статического интерфейса (HUD Protection).

            ### 2. Исправление буфера обмена и чистка интерфейса Decky
            - **Надежное копирование параметров запуска**: Добавлена прямая передача в системный буфер обмена SteamOS (`wl-copy` / `xclip` на уровне демона + SteamClient API + Navigator Clipboard). Теперь команды реально копируются и вставляются!
            - **Удалены устаревшие пресеты**: Убран старый выпадающий список «Профиль вычислений (180p/240p/360p)», оставлен удобный динамический ползунок плотности (50%–100%, 90% по умолчанию).
            - **Исправлены надписи**: Убраны упоминания RIFE 4.6, актуализирована информация о движке DIS-Flow + TV-L1.

            ### 3. Проверенная стабильная архитектура слоя v1.1.3
            - Промежуточный кадр выводится мгновенно ($t=0$), реальный кадр выводится фоновым потоком с точным интервалом ($t=16.67$ мс).
            - **0.0% нагрузки на CPU**: фоновый воркер использует системный `sleep_until` без удержания мьютекса.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
