name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8.5
          name: "SkyFrame v1.8.5 — Restored Motion Interpolation & 3x3 Vector Median Cleaning"
          body: |
            ## 🚀 SkyFrame v1.8.5 — Восстановление истинной интерполяции движения и 3x3 медианная очистка

            В этом обновлении устранен критический баг шейдера варпинга, из-за которого кадры дублировались:

            ### 1. Восстановление честного симметричного варпинга
            - **Ликвидация ложного схлопывания в нативные кадры**: В v1.8.4 некорректный static color clamping и инвертированный smoothstep отсекали смещенные пиксели и обнуляли вес варпинга, из-за чего на экран выводились дубликаты кадров без движения.
            - **Честная интерполяция $t = 0.5$**: Кадры $I_0$ и $I_1$ смещаются навстречу друг другу по вектору движения: $x - 0.5 \cdot \vec{V}$ и $x + 0.5 \cdot \vec{V}$, создавая честный промежуточный кадр на 50% фазы движения.
            - **Корректный фотометрический фоллбек**: `photoConfidence = 1.0 - smoothstep(0.20, 0.50, photoDiff)` сохраняет полный вес интерполяции при нормальном движении и плавно предохраняет от разрывов при окклюзиях.

            ### 2. Сохранение очистки векторов (3x3 Vector Median Filter)
            - Частичная сортировочная сеть 3x3 в `dis_smooth.comp` устраняет случайные квадраты и точечные аномалии оптического потока.
            - Диапазон поиска векторов до $\pm 136$ экранных пикселей в `dis_search.comp` сохранён для плавных поворотов камеры.

            ### 3. Синхронная аппаратная доставка кадров по VBlank
            - Сохранён 100% стабильный синхронный конвейер доставки кадров по VBlank на основном потоке.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
