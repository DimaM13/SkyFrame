name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.2
          name: "SkyFrame v1.2.2 for Steam Deck"
          body: |
            ## 🚀 SkyFrame v1.2.2 — Dense Bilinear Optical Flow & Presentation Fix

            ### Что нового и исправлено в v1.2.2:
            - **Плотный билинейный оптический поток (Dense Bilinear Optical Flow):**
              - Полностью ликвидированы макроблоки и «огромные пиксели» (сетка 8x8) при движении камеры и объектов.
              - Разделение на 2-проходный конвейер:
                - **Pass 1 (`motion_field.comp`)**: Блоки 8x8 вычисляют векторы движения с предзагрузкой блока Frame 1 в быструю память LDS (в 16 раз меньше обращений к VRAM!). Векторы сохраняются в текстуру оптического потока `u_MotionField` (64 КБ в VRAM).
                - **Pass 2 (`warp_blend.comp`)**: Каждый пиксель экрана считывает карту векторов с 4-точечной билинейной интерполяцией между центрами соседних блоков. Каждый пиксель получает непрерывный субпиксельный вектор движения — движение цельное и монолитное, без видимых квадратов.
            - **Устранение голодания буферов свопчейна (Swapchain Starvation Fix):**
              - В `Hook_vkCreateSwapchainKHR` размер свопчейна расширен до 8 буферов (`minImageCount = 8`), а размер циклического буфера слотов `RING_SIZE` увеличен до 8.
              - В тяжелых 3D-играх (как Ghost Recon Wildlands) у SkyFrame всегда есть свободные буферы для генерации промежуточного кадра. Зелёный маркер и сгенерированные кадры больше не пропадают в 3D-геймплее.
            - **Асинхронный Present Worker (Zero Main-Thread Stall & Flat Frametimes):**
              - Устранена блокировка основного потока игры. Основной поток рендера мгновенно возвращается в игру, сохраняя полную отзывчивость управления и отдавая игре все 33.3 мс мощности APU.
              - Выделенный фоновый поток `PresentWorkerLoop` синхронизирует вывод кадров строго через 1 такт VBlank (16.67 мс на 60 Гц), обеспечивая идеально ровный фреймтайм в оверлее SteamOS без зазубрин.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
