name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Build NCNN Vulkan Static Library (64-bit)
        run: |
          git clone --recursive --depth 1 https://github.com/Tencent/ncnn.git
          cd ncnn
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DNCNN_VULKAN=ON \
            -DNCNN_SIMPLEVK=OFF \
            -DNCNN_SYSTEM_GLSLANG=OFF \
            -DNCNN_BUILD_EXAMPLES=OFF \
            -DNCNN_BUILD_TESTS=OFF \
            -DNCNN_BUILD_BENCHMARK=OFF \
            -DNCNN_BUILD_TOOLS=OFF \
            -DNCNN_OPENMP=OFF \
            -DNCNN_SHARED_LIB=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/ncnn_install
          cmake --build . --config Release -j$(nproc)
          cmake --install .
          cd ../..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build with NCNN Vulkan RIFE FlowNet
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release -DNCNN_DIR=$GITHUB_WORKSPACE/ncnn_install
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build (fallback compute shader for 32-bit games)
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_NCNN=OFF -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.4
          name: "SkyFrame v1.1.4 for Steam Deck (RIFE FlowNet + Native FastWarp 1280x800)"
          body: |
            ## 🚀 SkyFrame v1.1.4 — Нейросетевой оптический поток (RIFE FlowNet NCNN) и нативный FastWarp (1280x800)

            ### Что нового в v1.1.4:
            - **Полноценный оптический поток RIFE FlowNet (NCNN Vulkan):** замена блочного шейдера 8x8 на глубокую нейросеть FlowNet, рассчитывающую непрерывное субпиксельное векторное поле движения (Dense Optical Flow) и карту окклюзий с аппаратным ускорением AMD RDNA2 FP16 (Packed Math).
            - **Полное устранение мерцающих пикселей и квадратов:** полностью ликвидированы разрывы на границах макроблоков 8x8 при поворотах камеры и быстром движении (листва, трава, сетки, тени).
            - **Нативный рендеринг FastWarp в 100% разрешении 1280x800:** шейдер `warp_rgba.comp` интерполирует исходные кадры в нативном разрешении дисплея с аппаратной билинейной фильтрацией поля векторов. Картинка остается максимально резкой без эффекта "мыла".
            - **Защита статического интерфейса (HUD Protection):** обнаружение и сохранение прицелов, полосок здоровья и миникарты без размытия и искажений.
            - **Оптимизировано под TDP 15W Steam Deck:** инференс на разрешении 180p/240p с инструкциями FP16 занимает всего ~3.5 мс GPU, сохраняя запас мощности для поддержания базовых 30 FPS.
            - **Автоматическая синхронизация (Auto VSync Cadence):** вывод 60 FPS с идеальным шагом ровно 16.67 мс под 60 Гц экран без задержек ввода.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
