name: Build SkyFrame for Steam Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake g++ g++-multilib gcc-multilib libvulkan-dev libvulkan-dev:i386 glslang-tools python3 zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Decky Frontend
        run: |
          cd decky-plugin
          npm install
          npm run build
          cd ..

      - name: Compile 64-bit and 32-bit Vulkan Layers (.so)
        run: |
          # 1. 64-bit build
          mkdir -p build64
          cd build64
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)
          cd ..

          # 2. 32-bit build
          mkdir -p build32
          cd build32
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build . --config Release -j$(nproc)
          cd ..

      - name: Prepare Decky Plugin binaries
        run: |
          mkdir -p decky-plugin/bin/models
          cp build64/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe.so
          cp build32/libVkLayer_skyframe.so decky-plugin/bin/libVkLayer_skyframe_32.so
          cp build64/vk_layer_skyframe.json decky-plugin/bin/vk_layer_skyframe.json
          cp -r models/* decky-plugin/bin/models/

      - name: Package Decky Plugin Zip
        run: |
          python3 scripts/package_decky_zip.py

      - name: Upload SkyFrame.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-SteamDeck
          path: SkyFrame.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8.2
          name: "SkyFrame v1.8.2 — Synchronous Hardware VBlank Delivery (Zero Thread Collision)"
          body: |
            ## 🚀 SkyFrame v1.8.2 — Синхронная аппаратная доставка кадров по VBlank (Zero Thread Collision)

            В этом обновлении полностью устранен сбой драйвера GPU и зависание после 1 кадра:

            ### 1. Синхронное разделение презентаций на основном потоке
            - **Ликвидация фонового потока и гонки очередей Vulkan**: В v1.8.1 фоновый поток презентации обращался к объекту `VkQueue` одновременно с отправкой команд из потока рендеринга DXVK. По спецификации Vulkan, одновременный вызов функций для одной и той же очереди `VkQueue` из разных потоков приводит к повреждению структур драйвера RADV и зависанию игры.
            - **Синхронный VBlank-пейсинг на основном потоке**: Теперь все вызовы Vulkan происходят строго последовательно в основном потоке рендеринга:
              1. Отправка промежуточного кадра `intermediateIdx` ($F_{N-0.5}$) в Gamescope.
              2. Высокоточная микросекундная пауза `SleepUntil` ровно на 1 такт VBlank дисплея (~16.67 мс при 60 Гц), во время которой Gamescope выводит промежуточный кадр на физический экран через DRM Direct Scanout.
              3. Отправка реального кадра игры `currentGameIdx` ($F_N$) для следующего такта VBlank.
              4. Возврат управления в DXVK.
            - **100% стабильность и отсутствие зависаний**: Нет фоновых потоков, нет мьютексов, нет условных переменных, нет гонок на `VkQueue`.

            ### 2. Сохранение максимального качества DIS-Flow
            - Все алгоритмы наивысшего качества (12-точечная TV-L1 диффузия с консенсусным фильтром и фотометрический fallback) сохранены на 100%.
          files: SkyFrame.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
